name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check (static typing — Constitution II)
        run: npm run typecheck
      - name: Lint & format (import boundaries — Constitution II)
        run: npm run lint
      - name: Tests (Constitution III)
        run: npm test
      - name: Coverage gates (100% engine, >=80% overall — Constitution III)
        run: npm run coverage
